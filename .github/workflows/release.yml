name: Publish NuGet to GitHub Release & NuGet.org

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release 版本号（如 1.0.0 或 v1.0.0）'
        required: true
        default: '1.0.0'
        type: string
      push_to_nuget:
        description: '是否推送到官方 nuget.org (需要配置 NUGET_API_KEY)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-pack:
    name: Build, Test & Pack NuGet
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Determine Package Version
        id: get-version
        shell: bash
        run: |
          RAW_VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          # 去除可能携带的 v 前缀 (如 v1.0.0 -> 1.0.0)
          CLEAN_VERSION="${RAW_VERSION#v}"
          TAG_NAME="v${CLEAN_VERSION}"
          echo "Package Version: $CLEAN_VERSION"
          echo "Release Tag: $TAG_NAME"
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Restore Dependencies
        run: dotnet restore

      - name: Run Tests
        run: dotnet test -c Release --no-restore --verbosity normal

      - name: Pack NuGet Packages
        run: >
          dotnet pack
          -c Release
          --no-build
          -o ./artifacts/nuget
          /p:PackageVersion=${{ steps.get-version.outputs.version }}
          /p:Version=${{ steps.get-version.outputs.version }}
          /p:ContinuousIntegrationBuild=true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/nuget/*.nupkg
          retention-days: 30

      - name: Generate Release Changelog
        id: changelog
        shell: bash
        run: |
          TAG_NAME="${{ steps.get-version.outputs.tag_name }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || echo "")
          echo "Previous tag: $PREV_TAG"

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" --no-merges 2>/dev/null || echo "")
            TITLE="更新日志 (\`${PREV_TAG}\` ➔ \`${TAG_NAME}\`)"
          else
            COMMITS=$(git log -n 20 --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" --no-merges 2>/dev/null || echo "")
            TITLE="版本发布更新日志 (\`${TAG_NAME}\`)"
          fi

          {
            echo "## ⚡ TemporaryDiagnostics 发布版本: ${TAG_NAME}"
            echo ""
            echo "### 📦 包含的 NuGet 包资产"
            echo "- **TemporaryDiagnostics.Core** (\`${{ steps.get-version.outputs.version }}\`): 诊断抽象契约、Result<T>、配置模型与状态机"
            echo "- **TemporaryDiagnostics.Infrastructure** (\`${{ steps.get-version.outputs.version }}\`): 跨平台 PTY/ConPTY 终端、IL Emit 动态编译器、系统指标适配器与 MCP 引擎"
            echo "- **TemporaryDiagnostics.AspNetCore** (\`${{ steps.get-version.outputs.version }}\`): 一键中间件集成、Minimal API 端点、嵌入式单页 UI 与 OpenAPI 文档"
            echo ""
            echo "<details><summary><b>📋 ${TITLE}</b></summary>"
            echo ""
            printf '%s\n' "$COMMITS"
            echo ""
            echo "</details>"
            echo ""
            echo "### 🚀 快速使用"
            echo '```csharp'
            echo 'builder.Services.AddTemporaryDiagnostics(options => {'
            echo '    options.AccessKey = "YourSecureKey@2026";'
            echo '    options.RoutePrefix = "/__diag";'
            echo '});'
            echo ''
            echo 'var app = builder.Build();'
            echo 'app.UseTemporaryDiagnostics();'
            echo 'app.Run();'
            echo '```'
          } > ./release_notes.md

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-version.outputs.tag_name }}
          name: "TemporaryDiagnostics ${{ steps.get-version.outputs.tag_name }}"
          body_path: ./release_notes.md
          files: ./artifacts/nuget/*.nupkg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Packages NuGet Registry
        continue-on-error: true
        shell: bash
        run: |
          echo "Pushing packages to GitHub Packages NuGet Registry..."
          for pkg in ./artifacts/nuget/*.nupkg; do
            if [ -f "$pkg" ]; then
              echo "==> Pushing $pkg to GitHub Packages..."
              dotnet nuget push "$pkg" \
                --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
                --api-key "${{ secrets.GITHUB_TOKEN }}" \
                --skip-duplicate || true
            fi
          done

      - name: NuGet Login via OIDC (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        continue-on-error: true
        with:
          user: csvkse

      - name: Push to Official NuGet.org
        shell: bash
        env:
          OIDC_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          SECRET_KEY: ${{ secrets.NUGET_API_KEY }}
          SHOULD_PUSH: ${{ github.event_name != 'workflow_dispatch' || inputs.push_to_nuget }}
        run: |
          KEY="${OIDC_KEY:-$SECRET_KEY}"
          if [ -z "$KEY" ]; then
            echo "::error ::未获取到 NuGet API 认证凭据（Trusted Publishing OIDC Token 与 NUGET_API_KEY 均为空）。请检查 Trusted Publishing 策略配置或添加 NUGET_API_KEY Secret。"
            exit 1
          elif [ "$SHOULD_PUSH" != "true" ]; then
            echo "用户在手动触发时选择了跳过推送到 nuget.org。"
          else
            if [ -n "$OIDC_KEY" ]; then
              echo "✅ 使用 NuGet.org Trusted Publishing (OIDC 无密钥凭据) 进行安全认证"
            else
              echo "ℹ️ 使用 Repository Secret (NUGET_API_KEY) 进行认证"
            fi
            echo "正在将 NuGet 包逐个推送到官方 nuget.org..."
            for pkg in ./artifacts/nuget/*.nupkg; do
              if [ -f "$pkg" ]; then
                echo "================================================="
                echo "==> 正在推送到 nuget.org: $pkg"
                echo "================================================="
                dotnet nuget push "$pkg" \
                  --source "https://api.nuget.org/v3/index.json" \
                  --api-key "$KEY" \
                  --skip-duplicate
              fi
            done
            echo "所有 NuGet 包已成功推送到 nuget.org！"
          fi
